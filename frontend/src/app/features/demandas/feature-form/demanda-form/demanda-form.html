<p-dialog
  [(visible)]="visivel"
  [header]="edicao() ? 'Editar demanda' : 'Nova demanda'"
  [modal]="true"
  [style]="{ width: '480px' }"
>
  <form [formGroup]="form" (ngSubmit)="salvar()" class="demanda-form">
    <label for="titulo">Título</label>
    <input pInputText id="titulo" formControlName="titulo" />

    <label for="descricao">Descrição</label>
    <textarea pTextarea id="descricao" formControlName="descricao" rows="2"></textarea>

    <label for="diretoria">Diretoria</label>
    <p-select inputId="diretoria" formControlName="diretoriaId" [options]="diretorias.value() ?? []"
              optionLabel="nome" optionValue="id" placeholder="Selecione" />

    <label for="demandante">Demandante</label>
    <p-select inputId="demandante" formControlName="demandanteId" [options]="opcoesDemandante()"
              optionLabel="nome" optionValue="id" [showClear]="true" placeholder="Selecione" />

    <label for="projeto">Projeto</label>
    <p-select inputId="projeto" formControlName="projetoId" [options]="opcoesProjeto()"
              optionLabel="nome" optionValue="id" [showClear]="true" placeholder="Nenhum" />

    <label for="campanha">Campanha</label>
    <p-select inputId="campanha" formControlName="campanhaId" [options]="opcoesCampanha()"
              optionLabel="nome" optionValue="id" [showClear]="true"
              [placeholder]="form.controls.projetoId.value ? 'Nenhuma' : 'Escolha um projeto antes'" />

    <label for="prioridade">Prioridade</label>
    <p-select inputId="prioridade" formControlName="prioridade" [options]="opcoesPrioridade" />

    <label for="prazo">Prazo</label>
    <p-datepicker inputId="prazo" formControlName="dataPrazo" dateFormat="dd/mm/yy" [showIcon]="true" />

    <label for="linkExterno">Link externo (opcional)</label>
    <input pInputText id="linkExterno" formControlName="linkExterno" placeholder="URL do Planner ou ClickUp" />
    @if (form.controls.linkExterno.invalid) {
      <small class="erro-campo">Informe uma URL começando com http:// ou https://</small>
    }

    <label for="observacoes">Observações</label>
    <textarea pTextarea id="observacoes" formControlName="observacoes" rows="3"></textarea>

    @if (erro()) {
      <p-message severity="error">{{ erro() }}</p-message>
    }

    <p-button type="submit" [loading]="carregando()" [disabled]="form.invalid || carregandoDemanda()">
      {{ edicao() ? 'Salvar' : 'Criar demanda' }}
    </p-button>
  </form>
</p-dialog>
