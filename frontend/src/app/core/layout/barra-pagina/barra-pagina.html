<div class="barra">
    <div class="barra__inicio">
        <div class="barra__texto">
            @if (titulo()) {
            <h1 class="barra__titulo">{{ titulo() }}</h1>
            }
            @if (subtitulo()) {
            <p class="barra__subtitulo">{{ subtitulo() }}</p>
            }
        </div>
        <ng-content select="[inicio]" />
    </div>
    <div class="barra__fim">
        <ng-content select="[fim]" />
    </div>
</div>
