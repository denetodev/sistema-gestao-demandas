<title>SGD: wireframe navegável</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Arial,sans-serif;color:#222;background:#fff}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#eee;border:1px solid #888;padding:4px 10px;cursor:pointer;border-radius:2px}
button:hover{background:#ddd}
button.pri{background:#444;color:#fff;border-color:#444}
button.lnk{background:none;border:none;padding:0;text-decoration:underline;cursor:pointer}
button.mini{padding:1px 6px;font-size:12px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{border:1px solid #888;padding:4px 6px;background:#fff;border-radius:2px;max-width:100%}
input[readonly]{background:#eee;color:#555}
textarea{width:100%}
.proto{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 12px;background:#222;color:#fff;font-size:13px}
.proto select{padding:1px 4px;color:#222}
.proto label{display:flex;gap:5px;align-items:center}
.proto .tt{font-weight:700;letter-spacing:.06em}
.app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;min-height:calc(100vh - 36px)}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:2px solid #444;gap:8px 12px;flex-wrap:wrap}
.side{border-right:1px solid #888;padding:10px 0;background:#f4f4f4}
.side a{display:flex;justify-content:space-between;padding:7px 16px;cursor:pointer;color:#222;text-decoration:none}
.side a:hover{background:#e4e4e4}
.side a.on{background:#c8c8c8;font-weight:600}
.side hr{border:0;border-top:1px dashed #888;margin:8px 12px}
.side .sec{font-size:11px;color:#777;padding:6px 16px 2px;text-transform:uppercase}
main{padding:16px 20px 40px;min-width:0}
h1{font-size:20px;margin:0}
h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.box{border:1px solid #888;padding:12px;margin-bottom:14px}
.box.ro{background:#f6f6f6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mb{margin-bottom:12px}
.muted{color:#666}
.small{font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #bbb;padding:5px 8px;text-align:left;vertical-align:middle}
th{background:#e6e6e6;font-weight:600;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#f1f1f1}
td select{padding:1px 3px}
.tag{display:inline-block;border:1px solid #777;padding:0 6px;font-size:12px;border-radius:2px;background:#f2f2f2;white-space:nowrap}
.tag.dk{background:#444;color:#fff;border-color:#444}
.tag.dash{border-style:dashed}
.av{display:inline-flex;width:26px;height:26px;border:1px solid #555;border-radius:50%;align-items:center;justify-content:center;font-size:10px;background:#fff;margin-right:-5px;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border-radius:0;margin-right:-1px}
.tabs button.on{background:#444;color:#fff;border-color:#444}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{border:1px solid #888;padding:8px}
.kpi .n{font-size:22px;font-weight:700}
.kpi.alert{border:2px solid #222}
.form{display:flex;flex-direction:column;gap:4px;max-width:440px}
.form label{font-weight:600;font-size:13px;margin-top:6px}
.form .hint{font-size:12px;color:#666}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.dl div{border:1px solid #ccc;padding:6px 8px}
.dl small{display:block;color:#666;font-size:11px;text-transform:uppercase}
.hmwrap{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:2px}
.hmm{display:grid;grid-auto-columns:11px;grid-auto-flow:column;gap:2px;font-size:10px;color:#666;height:14px}
.hmm span{white-space:nowrap;overflow:visible}
.hm i,.lg i{width:11px;height:11px;border:1px solid #bbb;display:inline-block}
.l0{background:#fff}.l1{background:#d6d6d6}.l2{background:#a6a6a6}.l3{background:#6a6a6a}.l4{background:#222}
.lg{display:flex;gap:2px;align-items:center;font-size:11px;color:#666}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:132px;border:1px solid #888;font-size:12px}
.thumb .img{height:72px;background:repeating-linear-gradient(45deg,#f2f2f2 0 6px,#e0e0e0 6px 12px);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;border-bottom:1px solid #888}
.thumb .cap{padding:4px 6px;display:flex;justify-content:space-between;gap:4px;word-break:break-all}
.grp{border:1px dashed #999;padding:8px;margin-bottom:8px}
.note{border:2px dashed #777;background:#fafafa;padding:10px 14px;margin:18px 0 0;font-size:13px}
.note ul{margin:6px 0 0;padding-left:18px}
.hide-notes .note{display:none}
.banner{border:1px solid #888;background:#eee;padding:6px 10px;margin-bottom:12px;font-size:13px}
.auth{display:flex;justify-content:center;padding:56px 16px}
.card{border:2px solid #444;padding:20px;width:340px;max-width:100%}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal{background:#fff;border:2px solid #333;padding:16px;width:440px;max-width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;right:16px;bottom:16px;background:#222;color:#fff;padding:8px 14px;z-index:40;font-size:13px}
.doc{border:1px solid #888;padding:28px 36px;max-width:780px;font-family:Georgia,'Times New Roman',serif;background:#fff}
.doc h3{text-align:center;margin:0 0 4px;font-size:18px}
.doc table{font-family:system-ui,Arial,sans-serif;font-size:13px}
.photo{width:96px;height:96px;border:1px solid #555;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#f2f2f2 0 6px,#e0e0e0 6px 12px);font-size:11px}
.strike td{text-decoration:line-through;color:#888}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid #888;display:flex;flex-wrap:wrap;padding:4px}
  .side a{padding:5px 10px}
  .side hr,.side .sec{display:none}
  main{padding:12px 16px 32px}
  .doc{padding:18px}

</style>
</head>

/* ============ regras de permissão (a matriz do protótipo) ============ */
const participa = (d,pid=me().id) => d.part.some(x=>x.pid===pid);
const principal = d => d.part.some(x=>x.pid===me().id && x.papel==='Responsável principal');
const temDaEquipe = d => !!me().ref && d.part.some(x=>P(x.pid).area===me().ref);
function canEditDemanda(d){
  if(isViewer()) return false;
  if(isGA()) return true;
  if(participa(d)) return true;
  return isRef() && temDaEquipe(d);
}
function canEditItem(pid){
  if(isViewer()) return false;
  if(isGA() || pid===me().id) return true;
  return isRef() && P(pid)?.area===me().ref;
}
function canManagePart(d,pid){
  if(isViewer()) return false;
  if(isGA() || principal(d)) return true;
  if(isRef() && P(pid)?.area===me().ref) return true;
  return pid===me().id; // sair da demanda
}
const canEditTipo = t => isGA() || (isRef() && t.area===me().ref);
const canAddPart = d => !isViewer() && (isGA() || principal(d) || isRef());
function canSee(screen){
  if(['demandantes','pessoas','pessoa'].includes(screen)) return isGA();
  return true;
}
function scopes(){
  const s=[];
  if(!isViewer()) s.push(['minhas','Minhas demandas']);
  if(isRef()) s.push(['equipe','Minha equipe']);
  s.push(['diretoria','Minha diretoria']);
  if(isGA()) s.push(['todas','Todas']);
  return s;
}
const defaultScope = () => isViewer() ? 'diretoria' : 'minhas';
function inScope(d,sc){
  if(sc==='minhas') return participa(d);
  if(sc==='equipe') return temDaEquipe(d);
  if(sc==='diretoria') return d.diretoria===me().diretoria;
  return true;
}

function heatmap(seedStr, pessoasAlvo, scale){
  const r = rng(hash(seedStr));
  const end = new Date(TODAY+'T12:00:00');
  const start = new Date(end); start.setDate(start.getDate()-364); start.setDate(start.getDate()-start.getDay());
  let cells='', months='', total=0, col=0, lastMonth=-1;
  for(const d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const iso = d.toISOString().slice(0,10); const wd = d.getDay();
    if(wd===0){ col++; const m=d.getMonth(); if(m!==lastMonth){ months+=`<span style="grid-column:${col}">${MESES[m].slice(0,3)}</span>`; lastMonth=m; } }
    const base = (wd===0||wd===6) ? (r()<.08?1:0) : Math.floor(r()*r()*6*scale);
    const real = db.atividades.filter(a=>a.data===iso && pessoasAlvo.includes(a.pid)).length;
    const n = base+real; total+=n; const q=n/scale;
    const lv = n===0?0 : q<=1?1 : q<=2?2 : q<=3.5?3 : 4;
    cells += `<i class="l${lv}" title="${fmt(iso)}: ${n} atividade(s)"></i>`;
  }
  return `<div class="hmwrap"><div class="hmm">${months}</div><div class="hm">${cells}</div></div>
    <div class="row between small" style="margin-top:6px"><span class="muted">${total} atividades registradas nos últimos 12 meses</span>
    <span class="lg">menos <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> mais</span></div>`;
}
function metricas(demandas, pessoasAlvo){
  const cont = Object.keys(STATUS).map(s=>[s, demandas.filter(d=>d.status===s).length]);
  const atvMes = db.atividades.filter(a=>pessoasAlvo.includes(a.pid) && a.data.startsWith(MES_ATUAL) && a.status!=='Cancelada').length;
  const atr = demandas.filter(atrasada).length;
  return `<div class="kpis">
    ${cont.map(([s,n])=>`<div class="kpi"><div class="small muted">${STATUS[s]}</div><div class="n">${n}</div></div>`).join('')}
    <div class="kpi"><div class="small muted">Atividades em ${MESES[+MES_ATUAL.slice(5)-1].toLowerCase()}</div><div class="n">${atvMes}</div></div>
    <div class="kpi alert"><div class="small muted">Demandas atrasadas</div><div class="n">${atr}</div></div>
  </div>
  <div class="kpis" style="margin-top:8px">
    <div class="kpi alert" style="grid-column:span 2"><div class="small muted">Valor gerado em ${MESES[+MES_ATUAL.slice(5)-1].toLowerCase()} (referência de mercado)</div><div class="n">${brl(valorGerado(pessoasAlvo, MES_ATUAL))}</div></div>
    <div class="kpi" style="grid-column:span 2"><div class="small muted">Valor gerado em ${MES_ATUAL.slice(0,4)}</div><div class="n">${brl(valorGerado(pessoasAlvo, MES_ATUAL.slice(0,4)))}</div></div>
  </div>`;
}

    extra = `<div class="box"><h2>Por área</h2><div class="tw"><table><tr><th>Área</th><th>Pessoas</th><th>Demandas ativas</th><th>Atividades no mês</th><th>Atrasadas</th><th>Valor no mês</th></tr>${linhas}</table></div></div>`;
    if(isGA() && state.dashPorPessoa){
      extra += `<div class="box"><h2>Por pessoa (detalhamento opcional)</h2><div class="tw"><table><tr><th>Pessoa</th><th>Área</th><th>Diretoria</th><th>Demandas ativas</th><th>Atividades no mês</th><th>Valor no mês</th></tr>${
        alvo.map(id=>{const p=P(id);return `<tr><td>${esc(p.nome)}</td><td>${p.area}</td><td>${p.diretoria}</td><td>${db.demandas.filter(d=>ativa(d)&&participa(d,id)).length}</td><td>${db.atividades.filter(a=>a.pid===id&&a.data.startsWith(MES_ATUAL)&&a.status!=='Cancelada').length}</td><td>${brl(valorGerado([id], MES_ATUAL))}</td></tr>`}).join('')}</table></div></div>`;
    }
    notas = isViewer()
      ? ['Somente leitura: agregado da diretoria da pessoa (CRM), sem seletor e sem atalhos de criação.','Visualizador não registra atividades, então não tem "meus números".']
      : ['Agregado por diretoria e área. Produtividade individual fica escondida por padrão e só aparece ao marcar "Detalhar por pessoa".','Gestor e Admin têm a mesma visão aqui.'];
  }
  notas.push('Valor gerado = soma de quantidade × valor unitário das peças produzidas pela pessoa (ou pelo grupo). O valor unitário fica congelado no lançamento da peça. Cada peça tem um único "produzida por", então somar equipe ou diretoria nunca conta a mesma peça duas vezes. Demandas canceladas ficam fora.');
  const pend = db.pessoas.filter(p=>p.status==='aguardando').length;
  const atalhos = [
    !isViewer() && `<button class="pri" onclick="go('demandaForm')">+ Nova demanda</button>`,
    `<button onclick="state.scope='${isViewer()?'diretoria':'minhas'}';go('demandas')">${isViewer()?'Ver demandas da diretoria':'Minhas demandas'}</button>`,
    isRef() && `<button onclick="state.scope='equipe';go('demandas')">Demandas da minha equipe</button>`,
    !isViewer() && `<button onclick="go('relatorio')">Relatório mensal</button>`,
    isGA() && `<button onclick="state.pessoasFiltro='aguardando';go('pessoas')">Aprovar cadastros (${pend})</button>`,
  ].filter(Boolean).join('');
  const seed = state.role+'|'+(isRef()?state.dashSel:isGA()?state.dashDir:'');
  return `<div class="row between mb"><h1>Dashboard</h1><div class="row">${ctrl}</div></div>
    <div class="box"><h2>Atalhos</h2><div class="row">${atalhos}</div></div>
    <div class="box"><h2>Atividade diária: ${esc(titulo)}</h2>${heatmap(seed, alvo, Math.max(1, Math.round(alvo.length/2)))}</div>
    <div class="box"><h2>Resumo: ${esc(titulo)}</h2>${metricas(demandas, alvo)}</div>
    ${extra}
    ${note(notas)}`;
}

/* ============ 5: lista de demandas ============ */
function upd(id,field,val){
  const d=D(id); d[field]=val;
  const label = field==='status'?STATUS[val]:field==='prioridade'?PRIOR[val]:C(val)?.nome;
  toast('Salvo na linha: '+field+' = '+label); render();
}
function scr_demandas(){
  if(!state.scope || !scopes().some(s=>s[0]===state.scope)) state.scope=defaultScope();
  const q = state.busca.toLowerCase();
  const list = db.demandas.filter(d=>inScope(d,state.scope)).filter(d=>!q || d.titulo.toLowerCase().includes(q));
  const rows = list.map(d=>{
    const ed = canEditDemanda(d); const stop='onclick="event.stopPropagation()"';
    const cliOpts = db.demandantes.filter(c=>c.diretoria===d.diretoria || c.id===d.demandante).map(c=>[c.id,c.nome]);
    return `<tr class="click" onclick="go('demanda','${d.id}')">
      <td><b>${esc(d.titulo)}</b></td>
      <td>${ed?`<select ${stop} onchange="upd('${d.id}','demandante',this.value)">${opts(cliOpts,d.demandante)}</select>`:esc(C(d.demandante)?.nome)}</td>
      <td>${d.diretoria}</td>
      <td>${ed?`<select ${stop} onchange="upd('${d.id}','status',this.value)">${opts(Object.entries(STATUS),d.status)}</select>`:tagStatus(d.status)}</td>
      <td>${ed?`<select ${stop} onchange="upd('${d.id}','prioridade',this.value)">${opts(Object.entries(PRIOR),d.prioridade)}</select>`:tagPrior(d.prioridade)}</td>
      <td style="white-space:nowrap">${fmt(d.prazo)} ${atrasada(d)?'<span class="tag dk">atrasada</span>':''}</td>
      <td style="white-space:nowrap">${brl(valorDemanda(d))}</td>
      <td style="white-space:nowrap">${d.part.map(x=>avatar(x.pid,x.papel)).join('')}</td>
    </tr>`;}).join('');
  const nomes = {minhas:'em que você participa',equipe:`com alguém da equipe ${me().ref}`,diretoria:`da diretoria ${me().diretoria}`,todas:'de todas as diretorias'};
  return `<div class="row between mb"><h1>Demandas</h1>${isViewer()?'':`<button class="pri" onclick="go('demandaForm')">+ Nova demanda</button>`}</div>
    <div class="row between">
      <div class="tabs">${scopes().map(([k,l])=>`<button class="${state.scope===k?'on':''}" onclick="state.scope='${k}';render()">${l}</button>`).join('')}</div>
      <input placeholder="Buscar por título…" value="${esc(state.busca)}" onchange="state.busca=this.value;render()" style="margin-bottom:12px">
    </div>
    <p class="small muted" style="margin:0 0 8px">${list.length} demanda(s) ${nomes[state.scope]}. Clique numa linha para abrir. Campos com seletor podem ser editados direto na linha.</p>
    <div class="tw"><table>
      <tr><th>Título</th><th>Demandante</th><th>Diretoria</th><th>Status</th><th>Prioridade</th><th>Prazo</th><th>Valor ref.</th><th>Participantes</th></tr>
      ${rows || `<tr><td colspan="8" class="muted">Nenhuma demanda neste escopo.</td></tr>`}
    </table></div>
    ${note([
      `Abas visíveis para ${ROLES[state.role].label}: ${scopes().map(s=>s[1]).join(', ')}. Padrão: <b>${scopes().find(s=>s[0]===defaultScope())[1]}</b>.`,
      isViewer() && 'Visualizador não participa de demandas, então "Minhas demandas" não existe e nada é editável na linha.',
      state.role==='profissional' && 'Edição na linha (status, prioridade, demandante) só nas demandas em que a pessoa participa. As outras da diretoria aparecem como texto.',
      isRef() && `Edita na linha as próprias demandas e as que têm alguém da equipe ${me().ref}. "Minha equipe" = demandas com pelo menos um participante da área.`,
      isGA() && 'Gestor e Admin editam qualquer linha. "Minhas demandas" pode vir vazia para eles; talvez valha abrir em "Todas" por padrão (decisão sua).',
      'A lista de demandantes na linha é filtrada pela diretoria da demanda.',
    ])}`;
}

/* ============ 6: detalhe da demanda ============ */
function mutDemanda(fn,msg){ fn(); if(msg) toast(msg); render(); }
function addPart(did){
  const pid=$('#np-p').value, papel=$('#np-r').value; if(!pid) return;
  mutDemanda(()=>D(did).part.push({pid,papel}),'Participante adicionado');
}
function rmPart(did,pid){ if(confirm('Remover '+P(pid).nome+' da demanda?')) mutDemanda(()=>{const d=D(did);d.part=d.part.filter(x=>x.pid!==pid)},'Participante removido'); }
function setPapel(did,pid,v){ D(did).part.find(x=>x.pid===pid).papel=v; toast('Papel alterado'); render(); }
function addAtv(did){
  const a={id:uid('a'),demanda:did,pid:$('#na-p').value,tipo:$('#na-t').value,data:$('#na-d').value||TODAY,descricao:$('#na-x').value||'(sem descrição)',status:'A fazer'};
  state.novaAtv=false; mutDemanda(()=>db.atividades.push(a),'Atividade registrada');
}
function saveAtv(id){ const a=A(id); a.status=$('#ea-s').value; a.descricao=$('#ea-x').value; state.editAtv=null; toast('Atividade salva'); render(); }
function cancelAtv(id){ if(confirm('Cancelar esta atividade?')){ A(id).status='Cancelada'; toast('Atividade cancelada'); render(); } }
function addPeca(did){ const nome=$('#npc-n').value.trim(); if(!nome){toast('Informe o nome da peça');return;} const t=TP($('#npc-t').value); const q=Math.max(1,+$('#npc-q').value||1); mutDemanda(()=>db.pecas.push({id:uid('pc'),demanda:did,tipo:t.id,nome,qtd:q,vu:t.valor,pid:$('#npc-p').value,data:TODAY}),'Peça adicionada: '+brl(t.valor*q)); }
function rmPeca(id){ if(confirm('Remover peça?')) mutDemanda(()=>{db.pecas=db.pecas.filter(p=>p.id!==id)},'Peça removida'); }
function addEvid(){ const alvo=$('#ne-a').value, nome=$('#ne-n').value.trim()||'arquivo_sem_nome'; state.novaEvid=false; mutDemanda(()=>db.evidencias.push({id:uid('e'),alvo,tipo:$('#ne-t').value,nome}),'Evidência adicionada'); }
function rmEvid(id){ mutDemanda(()=>{db.evidencias=db.evidencias.filter(e=>e.id!==id)},'Evidência removida'); }
function cancelarDemanda(id){ if(confirm('Cancelar a demanda inteira?')) mutDemanda(()=>{D(id).status='CANCELADA'},'Demanda cancelada'); }
const donoAlvo = alvo => alvo.startsWith('a') ? A(alvo)?.pid : null;
const canEditAlvo = (d,alvo) => alvo.startsWith('pc') ? canEditItem(PC(alvo)?.pid) : canEditItem(A(alvo)?.pid);

      <td style="white-space:nowrap"><button class="mini pri" onclick="saveAtv('${a.id}')">Salvar</button> <button class="mini" onclick="state.editAtv=null;render()">Voltar</button></td></tr>`;
    return `<tr class="${a.status==='Cancelada'?'strike':''}"><td>${esc(P(a.pid).nome)}${a.pid===me().id?' <span class="tag">você</span>':''}</td><td>${a.tipo}</td><td>${fmt(a.data)}</td><td>${esc(a.descricao)}</td><td><span class="tag">${a.status}</span></td>
      <td style="white-space:nowrap">${pode&&a.status!=='Cancelada'?`<button class="mini" onclick="state.editAtv='${a.id}';render()">✎ Editar</button> <button class="mini" onclick="cancelAtv('${a.id}')">✕ Cancelar</button>`:'<span class="muted small">somente leitura</span>'}</td></tr>`}).join('');
  const quemRegistra = isGA() ? partIds : isRef() ? partIds.filter(id=>id===me().id||P(id).area===me().ref) : partIds.filter(id=>id===me().id);
  const novaAtv = ed && quemRegistra.length ? (state.novaAtv ? `<div class="box ro" style="margin:8px 0 0"><div class="row">
      <select id="na-p">${opts(quemRegistra.map(id=>[id,P(id).nome]))}</select><select id="na-t">${opts(TIPOS_ATV)}</select><input id="na-d" type="date" value="${TODAY}">
      <input id="na-x" placeholder="Descrição" style="flex:1;min-width:160px"><button class="pri" onclick="addAtv('${d.id}')">Registrar</button><button onclick="state.novaAtv=false;render()">Fechar</button></div></div>`
      : `<button style="margin-top:8px" onclick="state.novaAtv=true;render()">+ Nova atividade</button>`) : '';

  // peças
  const pecaRows = pecas.map(p=>{const pode=canEditItem(p.pid)&&d.status!=='CANCELADA'; return `<tr><td>${esc(TP(p.tipo).nome)}</td><td>${esc(p.nome)}</td><td>${esc(P(p.pid).nome.split(' ')[0])}</td><td>${p.qtd}</td><td style="white-space:nowrap">${brl(p.vu)}</td><td style="white-space:nowrap"><b>${brl(valorPeca(p))}</b></td><td>${db.evidencias.filter(e=>e.alvo===p.id).length}</td><td>${pode?`<button class="mini" onclick="rmPeca('${p.id}')">✕</button>`:''}</td></tr>`}).join('')
    + (pecas.length?`<tr><td colspan="5"><b>Total da demanda</b></td><td style="white-space:nowrap"><b>${brl(valorDemanda(d))}</b></td><td colspan="2"></td></tr>`:'');
  const minhaArea = me().ref || me().area;
  const tiposAtivos = db.tiposPeca.filter(t=>t.ativo).sort((a,b)=>(b.area===minhaArea)-(a.area===minhaArea) || a.area.localeCompare(b.area));
  const addPecaForm = ed && quemRegistra.length && d.status!=='CANCELADA' ? `<div class="row" style="margin-top:8px">
      <select id="npc-t">${tiposAtivos.map(t=>opt(t.id, t.area+' · '+t.nome+' · '+brl(t.valor))).join('')}</select>
      <input id="npc-n" placeholder="Nome da peça" style="min-width:140px"><label class="row small">Qtd <input id="npc-q" type="number" min="1" value="1" style="width:60px"></label>
      <select id="npc-p">${opts(quemRegistra.map(id=>[id,'Produzida por '+P(id).nome]))}</select>
      <button onclick="addPeca('${d.id}')">+ Adicionar peça</button></div>
      <p class="small muted" style="margin:6px 0 0">O valor unitário vem do catálogo Tipos de Peça e fica congelado na peça.</p>` : '';

  // evidências
  const alvos = [...atvs.map(a=>({id:a.id,label:`Atividade: ${a.descricao} (${P(a.pid).nome.split(' ')[0]})`})), ...pecas.map(p=>({id:p.id,label:`Peça: ${p.nome}`}))];
  const grupos = alvos.map(al=>{const ev=db.evidencias.filter(e=>e.alvo===al.id); if(!ev.length) return '';
    return `<div class="grp"><div class="small" style="margin-bottom:6px"><b>${esc(al.label)}</b></div><div class="thumbs">${ev.map(e=>`<div class="thumb"><div class="img">[${e.tipo.toUpperCase()}]</div><div class="cap"><span>${esc(e.nome)}</span>${canEditAlvo(d,al.id)?`<button class="lnk small" title="remover" onclick="rmEvid('${e.id}')">✕</button>`:''}</div></div>`).join('')}</div></div>`}).join('');
  const alvosEditaveis = alvos.filter(al=>canEditAlvo(d,al.id));
  const novaEvid = alvosEditaveis.length ? (state.novaEvid ? `<div class="box ro" style="margin:8px 0 0"><div class="form" style="max-width:none">

      <label>Arquivo, URL ou texto</label><div class="row"><input id="ne-n" placeholder="ex.: print_final.png ou https://…" style="flex:1"><button>📎 Escolher arquivo</button></div>
      <div class="row" style="margin-top:8px"><button class="pri" onclick="addEvid()">Adicionar evidência</button><button onclick="state.novaEvid=false;render()">Fechar</button></div></div></div>`
      : `<button style="margin-top:8px" onclick="state.novaEvid=true;render()">+ Adicionar evidência (print, link, arquivo)</button>`) : '';

  const motivoRO = isViewer() ? 'Visualizador: tudo em somente leitura.' : 'Você não participa desta demanda e ninguém da sua equipe está nela: somente leitura.';
  return `<div class="row between mb"><button class="lnk" onclick="go('demandas')">← Voltar para Demandas</button>
      <div class="row">${ed?`<button onclick="go('demandaForm','${d.id}')">✎ Editar demanda</button>`:''}${(isGA()||principal(d))&&d.status!=='CANCELADA'?`<button onclick="cancelarDemanda('${d.id}')">✕ Cancelar demanda</button>`:''}</div></div>
    ${ed?'':`<div class="banner">🔒 ${motivoRO}</div>`}
    <div class="box">
      <div class="row between mb"><h1>${esc(d.titulo)}</h1>
        <div class="row">Status: ${ed?`<select onchange="upd('${d.id}','status',this.value)">${opts(Object.entries(STATUS),d.status)}</select>`:tagStatus(d.status)}</div></div>
      ${d.descricao?`<p class="muted" style="margin-top:0">${esc(d.descricao)}</p>`:''}

        <div><small>Demandante</small>${esc(C(d.demandante)?.nome)}</div><div><small>Diretoria</small>${d.diretoria}</div>
        <div><small>Projeto</small>${esc(PR(d.projeto)?.nome||'—')}</div><div><small>Campanha</small>${esc(CP(d.campanha)?.nome||'—')}</div>
        <div><small>Prioridade</small>${tagPrior(d.prioridade)}</div><div><small>Prazo</small>${fmt(d.prazo)} ${atrasada(d)?'<span class="tag dk">atrasada</span>':''}</div>
        <div><small>Valor de referência</small><b>${brl(valorDemanda(d))}</b></div>
        <div><small>Link externo</small>${d.link?`<a href="#" onclick="return false">${esc(d.link)}</a>`:'—'}</div>
      </div>
    </div>
    <div>
      <div class="box"><h2>Participantes (${d.part.length})</h2><div class="tw"><table><tr><th>Pessoa</th><th>Área</th><th>Papel</th><th></th></tr>${partRows}</table></div>${addPartForm}</div>
      <div class="box"><h2>Peças (${pecas.length})</h2><div class="tw"><table><tr><th>Tipo</th><th>Nome</th><th>Por</th><th>Qtd</th><th>Valor unit.</th><th>Total</th><th>Evid.</th><th></th></tr>${pecaRows||'<tr><td colspan="8" class="muted">Nenhuma peça.</td></tr>'}</table></div>${addPecaForm}</div>
    </div>
    <div class="box"><h2>Atividades (${atvs.length})</h2><div class="tw"><table><tr><th>Pessoa</th><th>Tipo</th><th>Data</th><th>Descrição</th><th>Status</th><th>Ações</th></tr>${atvRows||'<tr><td colspan="6" class="muted">Nenhuma atividade.</td></tr>'}</table></div>${novaAtv}</div>
    <div class="box"><h2>Evidências (${db.evidencias.filter(e=>alvos.some(a=>a.id===e.alvo)).length})</h2>${grupos||'<p class="muted">Nenhuma evidência ainda.</p>'}${novaEvid}</div>
    ${note([
      isViewer() && 'Visualizador vê tudo e não edita nada: sem seletores, sem botões de ação.',
      state.role==='profissional' && `Profissional só edita e cancela as <b>próprias</b> atividades e evidências. Participantes: pode mudar o próprio papel ou sair; adicionar e remover outras pessoas fica com o Responsável principal${principal(d)?' (que é você nesta demanda)':''}.`,
      isRef() && `Referência de Equipe edita e cancela itens de colegas da área <b>${me().ref}</b> (ex.: Diego e Elisa) além dos próprios. Itens de outras áreas ficam em somente leitura. Pode adicionar ao time pessoas da própria área.`,
      isGA() && 'Gestor e Admin editam tudo, adicionam qualquer pessoa e cancelam a demanda.',
      !isGA() && !isViewer() && 'Cancelar a demanda inteira fica só com Gestor, Admin e o Responsável principal.',
      'Teste: abra "Black Friday Cartões" como Profissional (Bruno), depois como Referência (Carla) e compare os botões ✎ e ✕ nas atividades.',
      'Peça tem um único "produzida por": só essa pessoa (ou a Referência da área dela, ou Gestor/Admin) remove a peça e as evidências dela.', 'Evidência aponta para uma atividade, uma peça ou as duas (CHECK intencional do banco). No protótipo simplifiquei para um vínculo só.',
    ])}`;
}

/* ============ 7: formulário de demanda ============ */
function ff(k,v,rerender){ state.form[k]=v; if(k==='diretoria'){state.form.demandante='';state.form.projeto='';state.form.campanha='';} if(k==='demandante'){state.form.projeto='';state.form.campanha='';} if(k==='projeto'){state.form.campanha='';} if(rerender) render(); }
function salvarDemanda(){
  const f=state.form;
  if(!f.titulo.trim() || !f.demandante){ toast('Preencha título e demandante'); return; }
  let id=f.id;
  if(id){ Object.assign(D(id), f); }
  else { id=uid('d'); db.demandas.unshift({...f,id,status:'NAO_INICIADA',part:[{pid:me().id,papel:'Responsável principal'}]}); }
  toast(f.id?'Demanda atualizada':'Demanda criada'); go('demanda',id);
}
function scr_demandaForm(){
  const f=state.form; const edit=!!f.id;
  if(isViewer()) return blocked('Visualizador não cria nem edita demandas.');
  if(edit && !canEditDemanda(D(f.id))) return blocked('Você não pode editar esta demanda.');

function rel(){
  const k=state.relMes;
  if(!state.rels[k]){
    const ids = db.atividades.filter(a=>a.pid===me().id && a.data.startsWith(k)).map(a=>a.id);
    state.rels[k] = {pid:me().id, sel:new Set(ids.filter(id=>A(id).status!=='Cancelada')), obs:'', fase:'selecao', aprovadoEm:null};
  }
  if(state.rels[k].pid!==me().id){ delete state.rels[k]; return rel(); }
  return state.rels[k];
}

  const a={id:uid('a'),demanda:null,pid:me().id,tipo:$('#av-t').value,data:$('#av-d').value||TODAY,descricao:$('#av-x').value||'(sem descrição)',status:'Concluída'};
  if(!a.data.startsWith(state.relMes)) { toast('A data precisa estar em '+nomeMes(state.relMes)); return; }
  db.atividades.push(a); rel().sel.add(a.id); state.novaAvulsa=false; toast('Atividade avulsa adicionada'); render();
}
function scr_relatorio(){
  if(isViewer()) return `<h1 class="mb">Relatório mensal</h1><div class="box ro">Visualizador não registra atividades, então não tem relatório mensal.</div>`+note(['Assumido na revisão do plano: relatório pertence a quem produz. Se o Visualizador precisar ver relatórios de outras pessoas, isso vira uma tela de consulta separada.']);
  const r=rel(); const mesesOpt=['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09'];
  const atvs = db.atividades.filter(a=>a.pid===me().id && a.data.startsWith(state.relMes)).sort((a,b)=>a.data.localeCompare(b.data));
  const aprovado=!!r.aprovadoEm;
  const header = `<div class="row between mb"><h1>Relatório mensal</h1>
    <label class="row">Mês: <select onchange="state.relMes=this.value;render()">${opts(mesesOpt.map(m=>[m,nomeMes(m)]),state.relMes)}</select></label></div>
    <div class="banner">Status: <b>${aprovado?'Aprovado por '+esc(me().nome)+' em '+fmt(r.aprovadoEm):r.fase==='previa'?'Rascunho gerado, aguardando sua aprovação':'Em preparação'}</b></div>`;
  if(r.fase==='previa'){
    const escolhidas = atvs.filter(a=>r.sel.has(a.id));
    const grupos = {}; escolhidas.forEach(a=>{const k=a.demanda?D(a.demanda).titulo:AVULSAS;(grupos[k]=grupos[k]||[]).push(a)});
    const m=me();
    const minhasPecas = db.pecas.filter(p=>p.pid===m.id && p.data.startsWith(state.relMes) && D(p.demanda)?.status!=='CANCELADA');
    return header+`<div class="doc">
      <h3>RELATÓRIO MENSAL DE ATIVIDADES</h3><p style="text-align:center;margin:0 0 18px">${nomeMes(state.relMes)}</p>
      <p><b>Profissional:</b> ${esc(m.nome)}<br><b>Diretoria:</b> ${m.diretoria} &nbsp; <b>Área:</b> ${m.area||'—'} &nbsp; <b>Cargo:</b> ${m.cargo}</p>
      ${Object.entries(grupos).sort((a,b)=>(a[0]===AVULSAS)-(b[0]===AVULSAS)).map(([g,l])=>`<p style="margin:14px 0 4px"><b>${esc(g)}</b></p><table><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Status</th></tr>${l.map(a=>`<tr><td>${fmt(a.data)}</td><td>${a.tipo}</td><td>${esc(a.descricao)}</td><td>${a.status}</td></tr>`).join('')}</table>`).join('') || '<p><i>Nenhuma atividade selecionada.</i></p>'}
      <p style="margin-top:16px"><b>Total:</b> ${escolhidas.length} atividade(s)</p>
      <p style="margin:14px 0 4px"><b>Peças produzidas no mês</b></p>
      ${minhasPecas.length?`<table><tr><th>Demanda</th><th>Peça</th><th>Tipo</th><th>Qtd</th><th>Valor</th></tr>${minhasPecas.map(p=>`<tr><td>${esc(D(p.demanda).titulo)}</td><td>${esc(p.nome)}</td><td>${esc(TP(p.tipo).nome)}</td><td>${p.qtd}</td><td style="white-space:nowrap">${brl(valorPeca(p))}</td></tr>`).join('')}</table>
      <p><b>Valor de referência gerado:</b> ${brl(minhasPecas.reduce((s,p)=>s+valorPeca(p),0))}</p>`:'<p><i>Nenhuma peça registrada no mês.</i></p>'}
      <p><b>Observações gerais:</b><br>${esc(r.obs)||'<i>Sem observações.</i>'}</p>
      <p style="margin-top:28px">_______________________________<br>${esc(m.nome)}${aprovado?' · aprovado em '+fmt(r.aprovadoEm):''}</p>
    </div>
    <div class="row" style="margin-top:12px">
      <button ${aprovado?'disabled':''} onclick="rel().fase='selecao';render()">✎ Editar</button>
      <button class="pri" ${aprovado?'disabled':''} onclick="if(confirm('Aprovar o relatório de ${nomeMes(state.relMes)}? Depois disso ele fica travado.')){rel().aprovadoEm='${TODAY}';toast('Relatório aprovado');render()}">✓ Aprovar</button>
      <button onclick="toast('Exportação simulada: PDF ou DOCX')">⇩ Exportar</button>
    </div>
    ${note(['A própria pessoa aprova o relatório (decidido na revisão). Depois de aprovado, Editar e Aprovar ficam desabilitados; só Exportar continua.',
      'Agrupado por demanda; atividades avulsas ficam num grupo próprio no fim.', 'Peças produzidas e o valor de referência entram automaticamente, a partir do "produzida por" de cada peça.'])}`;
  }
  return header+`<div class="box"><h2>Atividades de ${nomeMes(state.relMes)} (${atvs.length})</h2>
    <p class="small muted" style="margin-top:0">Pré-carregadas a partir do que você registrou nas demandas. Desmarque o que não deve entrar.</p>
    <div class="tw"><table><tr><th></th><th>Data</th><th>Demanda</th><th>Tipo</th><th>Descrição</th><th>Status</th></tr>
    ${atvs.map(a=>`<tr><td><input type="checkbox" ${r.sel.has(a.id)?'checked':''} onchange="toggleSel('${a.id}',this.checked)"></td><td>${fmt(a.data)}</td><td>${a.demanda?esc(D(a.demanda).titulo):'<span class="tag dash">avulsa</span>'}</td><td>${a.tipo}</td><td>${esc(a.descricao)}</td><td>${a.status}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nenhuma atividade registrada neste mês.</td></tr>'}
    </table></div>
    ${state.novaAvulsa?`<div class="box ro" style="margin:8px 0 0"><div class="row"><select id="av-t">${opts(TIPOS_ATV)}</select><input id="av-d" type="date" value="${state.relMes===MES_ATUAL?TODAY:state.relMes+'-15'}"><input id="av-x" placeholder="Descrição da atividade avulsa" style="flex:1;min-width:180px"><button class="pri" onclick="addAvulsa()">Adicionar</button><button onclick="state.novaAvulsa=false;render()">Fechar</button></div></div>`
      :`<button style="margin-top:8px" onclick="state.novaAvulsa=true;render()">+ Adicionar atividade avulsa</button>`}
    </div>
    <div class="box"><h2>Observações gerais</h2><textarea rows="3" onchange="rel().obs=this.value" placeholder="Contexto do mês, férias, bloqueios…">${esc(r.obs)}</textarea></div>
    <button class="pri" ${aprovado?'disabled':''} onclick="rel().fase='previa';render()">Gerar relatório</button>
    ${aprovado?' <button onclick="rel().fase=\'previa\';render()">Ver relatório aprovado</button>':''}
    ${note(['O relatório é sempre de quem está logado. Troque o papel no topo e veja a lista mudar de pessoa.',
      'Atividade avulsa = atividade sem demanda (<code>demanda_id</code> nulo). Ela também passa a contar no Dashboard.',
      'Atividades canceladas vêm desmarcadas por padrão.'])}`;
}

const SCREENS = {
  login:scr_login, cadastro:scr_cadastro, aguardando:scr_aguardando, dashboard:scr_dashboard,
  demandas:scr_demandas, demanda:scr_demanda, demandaForm:scr_demandaForm,
  demandantes:scr_demandantes, projetos:scr_projetos, campanhas:scr_campanhas, tiposPeca:scr_tiposPeca,
  pessoas:scr_pessoas, pessoa:scr_pessoa, perfil:scr_perfil, relatorio:scr_relatorio,
};
state.scope = defaultScope();
render();
</script>
</body>
</html>
