spring:
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  devtools:
    # o DevTools força include-stacktrace=always em desenvolvimento; desligado para valer o que está aqui
    add-properties: false

  application:
    name: sgd-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://sctjksvryeboakgjmnqg.supabase.co/auth/v1}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Supabase Storage (evidências em imagem). A service role key só existe no backend.
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  # Integração com o Planner da Microsoft (só leitura, pelo Graph). Desligada por padrão: sem as variáveis, nada roda.
  planner:
    enabled: ${PLANNER_ENABLED:false}
    tenant-id: ${PLANNER_TENANT_ID:}
    client-id: ${PLANNER_CLIENT_ID:}
    client-secret: ${PLANNER_CLIENT_SECRET:}
    # ids dos planos, separados por vírgula
    plan-ids: ${PLANNER_PLAN_IDS:}
    # diretoria das demandas criadas a partir do Planner
    diretoria: ${PLANNER_DIRETORIA:COE/CRM}
    # buckets (separados por vírgula) cujas tarefas não geram sugestão, por já estarem encerradas
    buckets-ignorados: ${PLANNER_BUCKETS_IGNORADOS:Implementado Martech}
    # só tarefas abertas criadas nos últimos N dias geram sugestão (o plano tem centenas de tarefas antigas)
    janela-dias: ${PLANNER_JANELA_DIAS:30}
    intervalo-ms: ${PLANNER_INTERVALO_MS:600000}

server:
  error:
    # o DevTools liga "always" em desenvolvimento; aqui fica explícito para nunca devolver stack trace
    include-stacktrace: never
    include-message: always
  # Railway injeta a porta em PORT; local continua em 8080
  port: ${PORT:8080}
