name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execução antiga da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npx ng build

      - name: Testes (Chrome headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # O mvnw está sem permissão de execução no git, por isso o bash.
      # SgdApiApplicationTests (contextLoads) sobe o Spring com o Postgres do Supabase e por isso
      # fica de fora do CI. Os demais são testes unitários com mocks.
      - name: Testes
        run: bash ./mvnw -B -ntp test -Dtest='!SgdApiApplicationTests'
